name: Publica imagem no GHCR

# Publica a imagem; não implanta. O BOCA guarda competições e contas, então
# ir para produção é trocar o digest no docker-compose.prod.yml por um PR.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/publica-imagem.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # em pull request a imagem é construída mas não publicada
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:sha-${{ github.sha }}

      - if: github.event_name != 'pull_request'
        run: |
          echo "Digest publicado: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
