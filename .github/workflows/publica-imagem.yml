name: Publica imagem no GHCR

# Merge na main: constrói e publica a imagem do web e grava o digest no
# docker-compose.prod.yml; o Portainer acompanha esse arquivo e aplica.
# O compose aponta para digest, nunca para tag: o commit que dispara a implantação
# é sempre posterior à imagem existir.
on:
  push:
    branches: [main]
    paths:
      - 'personalizacao/**'
      - 'Dockerfile'
      - 'base.sha256'
      - 'verifica-base.sh'
      - '.github/workflows/publica-imagem.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # falha se a versão nova da base mudou um arquivo que personalizacao/ sobrescreve
      - name: Confere a base contra os arquivos personalizados
        run: ./verifica-base.sh

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # em pull request a imagem é construída mas não publicada
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/web:sha-${{ github.sha }}

      - if: github.event_name != 'pull_request'
        run: |
          echo "Digest publicado: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  implanta:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Grava o digest no compose de produção
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          ARQ=docker-compose.prod.yml
          IMG="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/web"
          sed -i -E "s#(image: )${IMG}@sha256:[a-f0-9]+#\1${IMG}@${DIGEST}#" "$ARQ"
          if git diff --quiet -- "$ARQ"; then
            echo "O compose já aponta para ${DIGEST}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "deploy: imagem do commit ${GITHUB_SHA:0:8}

          Digest: ${DIGEST}

          O Portainer aplica em até 5 minutos. Para voltar: git revert deste commit." -- "$ARQ"
          # push com GITHUB_TOKEN não dispara workflow, então não há laço
          git push -q origin HEAD:main
