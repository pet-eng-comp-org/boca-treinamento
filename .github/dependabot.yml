# Abre PR quando sai versão nova das bases (boca-web no Dockerfile, boca-jail no jail/Dockerfile),
# do postgres ou das actions. boca-web e boca-jail chegam em PRs separados: implantar os dois juntos.
version: 2
updates:
  - package-ecosystem: docker
    directories: [/, /jail]
    schedule:
      interval: weekly
    labels: [dependencias]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencias]
    ignore:
      # a imagem do PET é publicada por este próprio repositório
      - dependency-name: ghcr.io/pet-eng-comp-org/boca-treinamento/web
      - dependency-name: ghcr.io/pet-eng-comp-org/boca-treinamento/jail
      # troca de versão maior do Postgres exige dump e restore, não só trocar a imagem
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
