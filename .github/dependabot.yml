# Abre PR quando sai versão nova do postgres ou das actions. As bases do BOCA (boca-web e
# boca-jail) não passam por aqui: o espelha-base.yml copia para o nosso GHCR e abre a PR, porque
# o rlaiola/boca-docker apaga as versões antigas toda semana e o digest fixado nele sumia.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    cooldown:
      # Versao nova so e proposta depois de 7 dias publicada: pacote
      # sequestrado costuma ser descoberto e retirado nesse prazo. Correcao
      # de seguranca nao espera (o cooldown nao vale para ela).
      default-days: 7
    schedule:
      interval: weekly
    labels: [dependencias]
    ignore:
      # a imagem do PET é publicada por este próprio repositório
      - dependency-name: ghcr.io/pet-eng-comp-org/boca-treinamento/web
      - dependency-name: ghcr.io/pet-eng-comp-org/boca-treinamento/jail
      # troca de versão maior do Postgres exige dump e restore, não só trocar a imagem
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    labels: [dependencias]
