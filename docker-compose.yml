version: "3"

services:
  boca-web:
    image: ghcr.io/petengcomp/boca-topcom:21
    restart: unless-stopped
    ports:
      - 8000:80
    depends_on:
      - boca-postgres
    environment:
      - BOCA_DB_HOST=boca-postgres
      - DB_PORT=5432
      - BOCA_DB_NAME=bocadb
      - BOCA_DB_USER=postgres
      - BOCA_DB_PASSWORD=treinamento23treinamento
      - BOCA_DB_SUPER_USER=postgres
      - BOCA_DB_SUPER_PASSWORD=treinamento23treinamento
      - BOCA_PASSWORD=boca
      - BOCA_URL=localhost:8000/boca
    networks:
      - boca
    # volumes:
    #   - ./topcom21-treinamento:/var/www/boca/src

  boca-jail:
    image: ghcr.io/rlaiola/boca-docker/boca-jail:teste
    restart: unless-stopped
    depends_on:
      - boca-postgres
    environment:
      - BOCA_DB_HOST=boca-postgres
      - DB_PORT=5432
      - BOCA_DB_NAME=bocadb
      - BOCA_DB_USER=postgres
      - BOCA_DB_PASSWORD=treinamento23treinamento
      - PASSWD=treinamento23treinamento
    networks:
      - boca

  boca-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      #POSTGRES_DB: bocadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: treinamento23treinamento
    networks:
      - boca

networks:
  boca:
    name: boca
