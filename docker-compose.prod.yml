# Stack `boca-treinamento` na VM (BOCA de treinamento do Topcom). As senhas vêm das variáveis de ambiente da stack no Portainer.
# O app usa o usuário comum `bocauser`; o superusuário `postgres` só serve ao init.sh.
services:
  boca-web:
    container_name: boca-treinamento_web
    image: ghcr.io/pet-eng-comp-org/boca-treinamento/web@sha256:78b059b1674fa8ffb248d255a8bb9a0b39ca66f769dba641406da17ffdedf312
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      boca-postgres:
        condition: service_healthy
    environment:
      # boca-postgres e boca-web são os nomes de serviço, únicos nas redes; um nome genérico como
      # "database" colidiria com o de outra stack na rede traefik
      - BOCA_DB_HOST=boca-postgres
      - DB_PORT=5432
      - BOCA_DB_NAME=bocadb
      - BOCA_DB_USER=bocauser
      - BOCA_DB_PASSWORD=${BOCA_DB_PASSWORD}
      - BOCA_DB_SUPER_USER=postgres
      - BOCA_DB_SUPER_PASSWORD=${BOCA_DB_SUPER_PASSWORD}
      - BOCA_PASSWORD=${BOCA_PASSWORD}
      - BOCA_KEY=${BOCA_KEY}
      - BOCA_URL=boca.pet.inf.ufes.br/boca
      # opções do BOCA do Rodrigo (rlaiola/boca) para o treino
      - BOCA_ENABLE_VIEW_RUNS=true       # a equipe vê o código que enviou
      - BOCA_ENABLE_PROBLEM_STATS=true   # dificuldade de cada problema
      - BOCA_SHOW_UNSOLVED_FIRST=true
      - BOCA_ENABLE_TABLE_FILTER=true
      - BOCA_DISABLE_TASKS=true          # impressão e balão só existem na competição presencial
      # IP real do visitante vem no X-Forwarded-For do Traefik. O BOCA só aceita curinga no último
      # octeto: 172.31.0.* cobre o IP atual do Traefik (172.31.0.3); se a rede traefik for recriada e ele
      # mudar de faixa, o BOCA volta a registrar o IP do Traefik (sem quebrar nada) até ajustar aqui.
      - BOCA_TRUSTED_PROXIES=172.31.0.*
    volumes:
      - /srv/boca-config/web-score/score.sep:/var/www/boca/src/private/score.sep
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.boca-treinamento_web.rule=Host(`boca.pet.inf.ufes.br`)"
      - "traefik.http.routers.boca-treinamento_web.priority=1"
      - "traefik.http.routers.boca-treinamento_web.middlewares=boca-treinamento_redirecionamento"
      - "traefik.http.middlewares.boca-treinamento_redirecionamento.redirectregex.regex=^https?://([^/]+)/?$$"
      - "traefik.http.middlewares.boca-treinamento_redirecionamento.redirectregex.replacement=https://$$1/boca"
      - "traefik.http.services.boca-treinamento_web.loadbalancer.server.port=80"
      - "traefik.http.routers.boca-treinamento_web.entrypoints=websecure"
      - "traefik.http.routers.boca-treinamento_web.tls.certresolver=le"
      # cadastro público: limite por IP contra cadastro em massa (folgado para um laboratório com o mesmo IP)
      - "traefik.http.routers.boca-treinamento_cadastro.rule=Host(`boca.pet.inf.ufes.br`) && Path(`/boca/cadastro/register.php`)"
      - "traefik.http.routers.boca-treinamento_cadastro.priority=100"
      - "traefik.http.routers.boca-treinamento_cadastro.entrypoints=websecure"
      - "traefik.http.routers.boca-treinamento_cadastro.tls.certresolver=le"
      - "traefik.http.routers.boca-treinamento_cadastro.service=boca-treinamento_web"
      - "traefik.http.routers.boca-treinamento_cadastro.middlewares=boca-treinamento_limite-cadastro"
      - "traefik.http.middlewares.boca-treinamento_limite-cadastro.ratelimit.average=10"
      - "traefik.http.middlewares.boca-treinamento_limite-cadastro.ratelimit.period=1m"
      - "traefik.http.middlewares.boca-treinamento_limite-cadastro.ratelimit.burst=30"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - interna

  # Privilegiado porque limita tempo e memória do código enviado pelas equipes.
  boca-jail:
    container_name: boca-treinamento_jail
    image: ghcr.io/rlaiola/boca-docker/boca-jail:1.2.3@sha256:8542b574b09bc0ef47b45c0a6751379ade15a63846b2f975f1283f4a1ddbba49
    privileged: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      boca-postgres:
        condition: service_healthy
    environment:
      - BOCA_DB_HOST=boca-postgres
      - BOCA_WEB_HOST=boca-web
      - BOCA_DB_NAME=bocadb
      - BOCA_DB_USER=bocauser
      - BOCA_DB_PASSWORD=${BOCA_DB_PASSWORD}
    networks:
      - interna

  boca-postgres:
    image: postgres:14-alpine@sha256:4ea9e5ed06591da7ea23eb65465e8d3187fe79f4d5ec3ae976d29a33b013e77a
    container_name: boca-treinamento_database
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - boca_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bocadb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - interna

volumes:
  boca_data:
    external: true
    name: boca_boca_data

networks:
  traefik:
    name: traefik
    external: true
  # jail e banco fora da rede compartilhada; internal: sem saída para a internet
  interna:
    internal: true
